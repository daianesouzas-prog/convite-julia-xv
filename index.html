<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Júlia XV — Convite</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="site">

  <!-- =========================
       CONVITE PRINCIPAL
  ========================== -->

  <section class="page invite-page">

    <img
      src="convite.png"
      alt="Convite Júlia XV"
      class="art"
    >

    <!-- CONFIRMAR PRESENÇA -->
    <button
      type="button"
      class="hotspot confirm"
      aria-label="Confirmar presença"
      onclick="openConfirm()">
    </button>

    <!-- LOCALIZAÇÃO -->
    <a
      class="hotspot location"
      aria-label="Abrir localização"
      href="https://maps.app.goo.gl/zsysBfrRDXfNh6GW7"
      target="_blank"
      rel="noopener noreferrer">
    </a>

  </section>


  <!-- =========================
       MANUAL DO CONVIDADO
  ========================== -->

  <section class="page manual-page">

    <img
      src="manual.png"
      alt="Manual do convidado Júlia XV"
      class="art"
    >

    <!-- SUGESTÃO DE PRESENTE -->
    <a
      class="hotspot gift"
      aria-label="Sugestão de presente"
      href="https://aniversario-gyot.listaideal.com.br/pt"
      target="_blank"
      rel="noopener noreferrer">
    </a>

    <!-- COPIAR PIX -->
    <button
      type="button"
      class="hotspot pix"
      aria-label="Copiar chave Pix"
      onclick="copyPix()">
    </button>

  </section>

</main>


<!-- =========================
     MODAL DO FORMULÁRIO
========================== -->

<div
  id="modal"
  class="modal"
  onclick="if(event.target === this) closeModal()">

  <div class="modal-box">

    <button
      type="button"
      class="close"
      aria-label="Fechar"
      onclick="closeModal()">
      ×
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
