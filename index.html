<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Júlia XV — Convite</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="site">

  <!-- =========================
       CONVITE PRINCIPAL
  ========================== -->

  <section class="page invite-page">

    <img
      src="convite.png"
      alt="Convite Júlia XV"
      class="art"
    >

    <!-- CÍRCULO CONFIRMAR -->
    <button
      type="button"
      class="hotspot confirm"
      aria-label="Confirmar presença"
      onclick="openConfirm()">
    </button>

    <!-- CÍRCULO LOCALIZAÇÃO -->
    <a
      class="hotspot location"
      aria-label="Abrir localização"
      href="https://maps.app.goo.gl/zsysBfrRDXfNh6GW7"
      target="_blank"
      rel="noopener noreferrer">
    </a>

  </section>


  <!-- =========================
       CONTAGEM REGRESSIVA
  ========================== -->

  <section class="countdown-section">

    <div class="countdown-title">
      CONTAGEM REGRESSIVA
    </div>

    <div class="countdown-grid">

      <div class="countdown-item">
        <strong id="days">00</strong>
        <span>DIAS</span>
      </div>

      <div class="countdown-item">
        <strong id="hours">00</strong>
        <span>HORAS</span>
      </div>

      <div class="countdown-item">
        <strong id="minutes">00</strong>
        <span>MIN</span>
      </div>

      <div class="countdown-item">
        <strong id="seconds">00</strong>
        <span>SEG</span>
      </div>

    </div>

  </section>


  <!-- =========================
       MANUAL DO CONVIDADO
  ========================== -->

  <section class="page manual-page">

    <img
      src="manual.png"
      alt="Manual do convidado Júlia XV"
      class="art"
    >

    <!-- SUGESTÃO DE PRESENTE -->
    <a
      class="hotspot gift"
      aria-label="Sugestão de presente"
      href="https://aniversario-gyot.listaideal.com.br/pt"
      target="_blank"
      rel="noopener noreferrer">
    </a>

    <!-- PIX -->
    <button
      type="button"
      class="hotspot pix"
      aria-label="Copiar chave Pix"
      onclick="copyPix()">
    </button>

  </section>

</main>


<!-- =========================
     MODAL
========================== -->

<div
  id="modal"
  class="modal"
  onclick="if(event.target === this) closeModal()">

  <div class="modal-box">

    <button
      type="button"
      class="close"
      aria-label="Fechar"
      onclick="closeModal()">
      ×
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
