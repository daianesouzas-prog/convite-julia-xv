<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Júlia XV - Convite</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="site">

    <!-- CONVITE PRINCIPAL -->
    <section class="convite-container">

      <img
        src="convite.png"
        alt="Convite Júlia XV"
        class="convite"
      >

    <!-- ÁREA CLICÁVEL - CONFIRMAÇÃO -->
<button
    type="button"
    class="area-clicavel confirmar"
    aria-label="Confirmar presença"
    onclick="abrirModal('confirmacao')">
</button>

<!-- ÁREA CLICÁVEL - LOCALIZAÇÃO -->
<a
    class="area-clicavel localizacao"
    aria-label="Abrir localização no Google Maps"
    href="https://maps.app.goo.gl/..."
    target="_blank"
    rel="noopener noreferrer">
</a>

      <!-- CONTAGEM REGRESSIVA -->
      <div class="countdown" id="countdown">

        <div class="countdown-title">
          CONTAGEM REGRESSIVA
        </div>

        <div class="countdown-grid">

          <div class="count-item">
            <span id="days">00</span>
            <small>DIAS</small>
          </div>

          <div class="count-item">
            <span id="hours">00</span>
            <small>HORAS</small>
          </div>

          <div class="count-item">
            <span id="minutes">00</span>
            <small>MIN</small>
          </div>

          <div class="count-item">
            <span id="seconds">00</span>
            <small>SEG</small>
          </div>

        </div>

      </div>

    </section>


    <!-- MANUAL DO CONVIDADO -->
    <section class="manual-container">

      <img
        src="manual.png"
        alt="Manual do Convidado Júlia XV"
        class="manual"
      >

      <!-- CONFIRMAR PRESENÇA NO MANUAL -->
      <button
        class="manual-button confirm-manual"
        onclick="abrirModal()"
        aria-label="Confirmar presença">
      </button>

      <!-- SUGESTÃO DE PRESENTE -->
      <a
        class="manual-button presente"
        href="https://aniversario-gyot.listadeideias.com.br/pt"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Sugestão de presente">
      </a>

      <!-- PIX -->
      <button
        class="manual-button pix"
        onclick="copyPix()"
        aria-label="Copiar chave Pix">
      </button>

    </section>

  </main>


  <!-- MODAL DE CONFIRMAÇÃO -->
  <div
    id="modal-confirmacao"
    class="modal"
    aria-hidden="true">

    <div class="modal-content">

      <button
        class="modal-close"
        onclick="fecharModal()"
        aria-label="Fechar">
        ×
      </button>

      <h2>Confirmar presença</h2>

      <p class="modal-subtitulo">
        Confirme sua presença no XV da Júlia.
      </p>


      <!-- CONVIDADO PRINCIPAL -->
      <div class="field">

        <label for="nomePrincipal">
          Seu nome completo
        </label>

        <input
          type="text"
          id="nomePrincipal"
          placeholder="Digite seu nome completo"
          autocomplete="name">

      </div>


      <!-- ADULTOS -->
      <section class="guest-section">

        <div class="guest-heading">

          <span>
            Adultos acompanhantes
          </span>

          <button
            type="button"
            class="btn-adicionar"
            onclick="adicionarAdulto()">
            + Adicionar adulto
          </button>

        </div>

        <div id="lista-adultos"></div>

      </section>


      <!-- CRIANÇAS -->
      <section class="guest-section">

        <div class="guest-heading">

          <span>
            Crianças até 7 anos
          </span>

          <button
            type="button"
            class="btn-adicionar"
            onclick="adicionarCrianca()">
            + Adicionar criança
          </button>

        </div>

        <div id="lista-criancas"></div>

      </section>


      <!-- ENVIO -->
      <button
        type="button"
        class="btn-enviar"
        onclick="enviarConfirmacao()">
        ENVIAR CONFIRMAÇÃO
      </button>

      <p class="aviso-whatsapp">
        Você será direcionado para o WhatsApp.
      </p>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
