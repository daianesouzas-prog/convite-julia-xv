<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Júlia XV — Convite</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="site">

  <!-- Página 1: convite -->
  <section class="page invite-page">
    <img src="convite.png" alt="Convite Júlia XV" class="art">
    <div class="hotspot confirm" role="button" tabindex="0"
         aria-label="Confirmar presença" onclick="openConfirm()"></div>
    <a class="hotspot location" aria-label="Abrir localização"
       href="https://maps.app.goo.gl/zsysBfrRDXfNh6GW7" target="_blank" rel="noopener"></a>
  </section>

  <!-- Página 2: manual -->
  <section class="page manual-page">
    <img src="manual.png" alt="Manual do convidado Júlia XV" class="art">
    <a class="hotspot gift" aria-label="Sugestão de presente"
       href="https://aniversario-gyot.listaideal.com.br/pt" target="_blank" rel="noopener"></a>
    <button class="hotspot pix" aria-label="Copiar chave Pix" onclick="copyPix()"></button>
  </section>

</main>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="close" aria-label="Fechar" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
