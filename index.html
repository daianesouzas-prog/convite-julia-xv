<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Júlia XV - Convite</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="site">

  <!-- CONVITE PRINCIPAL -->
  <section class="convite-container">

    <img src="convite.png" alt="Convite Júlia XV" class="convite">

    <!-- ÁREA CLICÁVEL CONFIRMAR PRESENÇA -->
    <button
      class="area-clicavel confirmar"
      aria-label="Confirmar presença"
      onclick="abrirModal('confirmacao')">
    </button>

    <!-- ÁREA CLICÁVEL LOCALIZAÇÃO -->
    <a
      class="area-clicavel localizacao"
      href="https://maps.app.goo.gl/zsysBfrRDXfNh6GW7"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Abrir localização no Google Maps">
    </a>

    <!-- CONTAGEM REGRESSIVA -->
    <div class="contador">
      <div class="contador-titulo">CONTAGEM REGRESSIVA</div>

      <div class="contador-grid">
        <div>
          <span id="dias">00</span>
          <small>DIAS</small>
        </div>

        <div>
          <span id="horas">00</span>
          <small>HORAS</small>
        </div>

        <div>
          <span id="minutos">00</span>
          <small>MIN</small>
        </div>

        <div>
          <span id="segundos">00</span>
          <small>SEG</small>
        </div>
      </div>
    </div>

  </section>


  <!-- MANUAL DO CONVIDADO -->
  <section class="manual-container">

    <img
      src="manual.png"
      alt="Manual do convidado Júlia XV"
      class="manual">

    <!-- BOTÃO SUGESTÃO DE PRESENTE -->
    <a
      class="botao-presente"
      href="https://aniversario-gyot.listaideal.com.br/pt"
      target="_blank"
      rel="noopener noreferrer">
    </a>

  </section>

</main>


<!-- MODAL DE CONFIRMAÇÃO -->
<div id="modal-confirmacao" class="modal">

  <div class="modal-conteudo">

    <button
      class="fechar"
      onclick="fecharModal()"
      aria-label="Fechar">
      ×
    </button>

    <h2>Confirmar presença</h2>

    <p class="subtitulo">
      Confirme sua presença no XV da Júlia.
    </p>


    <!-- NOME DO CONVIDADO PRINCIPAL -->
    <div class="campo">
      <label for="nomePrincipal">
        Seu nome completo
      </label>

      <input
        type="text"
        id="nomePrincipal"
        placeholder="Digite seu nome completo">
    </div>


    <!-- ADULTOS -->
    <div class="grupo-convidados">

      <div class="titulo-grupo">
        <span>Adultos acompanhantes</span>

        <button
          type="button"
          class="btn-adicionar"
          onclick="adicionarAdulto()">
          + Adicionar adulto
        </button>
      </div>

      <div id="lista-adultos"></div>

    </div>


    <!-- CRIANÇAS -->
    <div class="grupo-convidados">

      <div class="titulo-grupo">
        <span>Crianças até 7 anos</span>

        <button
          type="button"
          class="btn-adicionar"
          onclick="adicionarCrianca()">
          + Adicionar criança
        </button>
      </div>

      <div id="lista-criancas"></div>

    </div>


    <button
      class="btn-enviar"
      onclick="enviarConfirmacao()">
      ENVIAR CONFIRMAÇÃO
    </button>

    <p class="aviso-whatsapp">
      Você será direcionado para o WhatsApp.
    </p>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
